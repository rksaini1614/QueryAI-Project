<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Gradients for that cool glowing blue effect -->
  <defs>
    <linearGradient id="qGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0052d4"/>
    </linearGradient>
  </defs>

  <!-- The Main 'Q' Ring with tail -->
  <path d="M 256 48 C 141.1 48 48 141.1 48 256 C 48 370.9 141.1 464 256 464 C 293.4 464 328.4 454.1 359.3 437.1 L 416 493.8 L 464 445.8 L 417.8 399.5 C 446.5 359.8 464 310.1 464 256 C 464 141.1 370.9 48 256 48 Z M 256 392 C 180.9 392 120 331.1 120 256 C 120 180.9 180.9 120 256 120 C 331.1 120 392 180.9 392 256 C 392 291 378.7 322.9 356.9 346.7 L 297.4 287.1 L 256 328.5 L 322.9 395.4 C 302.7 403.4 280 408 256 392 Z" fill="url(#qGrad)"/>

  <!-- Network Connecting Lines -->
  <path d="M 150 150 L 100 256 L 150 360 M 150 150 L 256 100 L 360 150" stroke="#ffffff" stroke-width="4" fill="none"/>
  
  <!-- Network Nodes (Dots) -->
  <circle cx="150" cy="150" r="18" fill="#ffffff"/>
  <circle cx="100" cy="256" r="18" fill="#ffffff"/>
  <circle cx="150" cy="360" r="18" fill="#ffffff"/>
  <circle cx="256" cy="100" r="18" fill="#ffffff"/>
  <circle cx="360" cy="150" r="18" fill="#ffffff"/>

  <!-- Database Icon on bottom right -->
  <g transform="translate(290, 260)">
    <ellipse cx="80" cy="40" rx="60" ry="20" fill="#00d2ff"/>
    <path d="M 20 40 L 20 80 A 60 20 0 0 0 140 80 L 140 40 Z" fill="url(#dbGrad)"/>
    <path d="M 20 80 A 60 20 0 0 0 140 80" stroke="#ffffff" stroke-width="4" fill="none"/>
    <path d="M 20 80 L 20 120 A 60 20 0 0 0 140 120 L 140 80 Z" fill="url(#dbGrad)"/>
    <path d="M 20 120 A 60 20 0 0 0 140 120" stroke="#ffffff" stroke-width="4" fill="none"/>
    <path d="M 20 120 L 20 160 A 60 20 0 0 0 140 160 L 140 120 Z" fill="url(#dbGrad)"/>
  </g>
</svg>
